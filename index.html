<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Aplicação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Minha Aplicação</h1>
 <section id="cadastro">
        <h2>Cadastro</h2>

        <input type="text" id="nome" placeholder="Nome">
        <input type="email" id="email" placeholder="Email">

        <button id="btnCadastrar">Cadastrar</button>
    </section>

    <section id="login">
        <h2>Login</h2>

        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginSenha" placeholder="Senha">

        <button id="btnLogin">Fazer login</button>
    </section>

    <section id="perfil">
        <h2>Meu Perfil</h2>

        <p id="nomePerfil">Nome: Usuário</p>

        <button id="editarPerfil">Editar nome</button>
    </section>

    <section id="busca">
        <h2>Buscar usuários</h2>

        <input type="text" id="campoBusca" placeholder="Digite um nome">

        <button id="btnBuscar">Buscar</button>

        <p id="resultadoBusca"></p>
    </section>

    <section id="notificacoes">
        <h2>Notificações</h2>

        <p id="notificacao">Você possui uma nova mensagem.</p>

        <button id="lerNotificacao">Marcar como lida</button>
    </section>

    <section id="configuracoes">
        <h2>Configurações</h2>

        <button id="modoEscuro">Ativar modo escuro</button>
    </section>

    <section id="historico">
        <h2>Histórico</h2>

        <ul id="listaHistorico">
            <li>Primeira atividade realizada</li>
        </ul>
    </section>
    <section id="favoritos">
        <h2>Favoritos</h2>

        <button id="btnFavorito">Adicionar aos favoritos</button>

        <p id="statusFavorito"></p>
    </section>

    <div id="app"></div>

    <script src="script.js"></script>
</body>
</html>
